          MOVIEBOX_B64

          base64 --decode "$GITHUB_WORKSPACE/moviebox.b64" \
            > "$GITHUB_WORKSPACE/build-output/MovieBox.cs3"
          rm -f "$GITHUB_WORKSPACE/moviebox.b64"

          EXPECTED_SHA="sha256-dbe49110f86661f5517d46bdaecfbe1887aad1c54d4c8b3d59e732ce21764049"
          ACTUAL_SHA="sha256-$(sha256sum "$GITHUB_WORKSPACE/build-output/MovieBox.cs3" | cut -d' ' -f1)"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: MovieBox artifact hash mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/src/build/plugins.json" \
             "$GITHUB_WORKSPACE/build-output/plugins.json"

          cat > "$GITHUB_WORKSPACE/build-output/repo.json" <<EOF
          {
            "name": "movieflick",
            "description": "movieflick CloudStream Extensions | 149",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
            ]
          }
          EOF

          # Keep exactly one MovieBox metadata entry and use CloudStream's
          # sha256-<lowercase-hex> format.
          python3 - "$GITHUB_WORKSPACE/build-output/plugins.json" "$GITHUB_WORKSPACE/build-output/MovieBox.cs3" "$GITHUB_REPOSITORY" <<'PYCODE'
          import hashlib
          import json
          import pathlib
          import sys

          plugins_path = pathlib.Path(sys.argv[1])
          cs3_path = pathlib.Path(sys.argv[2])
          repository = sys.argv[3]

          plugins = json.loads(plugins_path.read_text(encoding="utf-8"))
          plugins = [
              p for p in plugins
              if p.get("internalName") not in {
                  "MovieBox",
                  "MovieBoxProvider",
                  "MovieBoxProviderIN",
              }
          ]

          raw = cs3_path.read_bytes()
          plugins.append({
              "iconUrl": "https://github.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/raw/refs/heads/master/Logos/MovieBoxProvider/icon.png",
              "fileHash": "sha256-" + hashlib.sha256(raw).hexdigest(),
              "apiVersion": 1,
              "repositoryUrl": f"https://github.com/{repository}",
              "fileSize": len(raw),
              "status": 1,
              "language": "hi",
              "authors": ["NivinCNC", "Movie-Flick"],
              "tvTypes": ["Movie", "TvSeries"],
              "version": 52,
              "internalName": "MovieBox",
              "description": "Multi Language Movies and Series Provider",
              "url": f"https://raw.githubusercontent.com/{repository}/builds/MovieBox.cs3",
              "name": "MovieBox",
          })

          plugins_path.write_text(
              json.dumps(plugins, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PYCODE

          python3 - "$GITHUB_WORKSPACE/build-output/plugins.json" <<'PYCODE2'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              plugins = json.load(f)
          entries = [p for p in plugins if p.get("internalName") == "MovieBox"]
          if len(entries) != 1:
              raise SystemExit(f"Expected exactly one MovieBox entry, found {len(entries)}")
          print(json.dumps(entries[0], ensure_ascii=False, indent=2))
          PYCODE2

          test -f "$GITHUB_WORKSPACE/build-output/repo.json"
          test -f "$GITHUB_WORKSPACE/build-output/plugins.json"
          test -f "$GITHUB_WORKSPACE/build-output/MovieBox.cs3"

      - name: Prepare builds branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf builds
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
          cd builds

          if git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            git fetch origin builds
            git checkout builds
            git rm -rf . || true
            git clean -fdx
          else
            git checkout --orphan builds
            git rm -rf . || true
            git clean -fdx
          fi

      - name: Copy build files
        run: |
          set -euo pipefail
          cp -f "$GITHUB_WORKSPACE/build-output/"* "$GITHUB_WORKSPACE/builds/"
          cd "$GITHUB_WORKSPACE/builds"
          test -f repo.json
          test -f plugins.json
          test -f MovieBox.cs3
          echo "✓ repo.json"
          echo "✓ plugins.json"
          echo "✓ MovieBox.cs3"

      - name: Push builds
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/builds"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build ${{ github.sha }}" || echo "No changes to commit"
          git push origin builds --force
