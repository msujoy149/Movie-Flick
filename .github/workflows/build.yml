name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TMDB_PRIMARY_API_KEY: ${{ secrets.TMDB_PRIMARY_API_KEY }}
          TMDB_PRIMARY_ACCESS_TOKEN: ${{ secrets.TMDB_PRIMARY_ACCESS_TOKEN }}
          TMDB_SECONDARY_API_KEY: ${{ secrets.TMDB_SECONDARY_API_KEY }}
          TMDB_SECONDARY_ACCESS_TOKEN: ${{ secrets.TMDB_SECONDARY_ACCESS_TOKEN }}
          TMDB_TERTIARY_API_KEY: ${{ secrets.TMDB_TERTIARY_API_KEY }}
          TMDB_TERTIARY_ACCESS_TOKEN: ${{ secrets.TMDB_TERTIARY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          gradle make makePluginsJson --no-daemon

      - name: Prepare build output
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/src"
          OUT="$GITHUB_WORKSPACE/build-output"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          test -f "$SRC/build/plugins.json"

          # Copy normal Gradle-built plugins.
          # Do NOT use find -exec here: YAML/shell escaping was causing
          # "find: missing argument to `-exec'".
          while IFS= read -r -d '' artifact; do
            case "$artifact" in
              "$SRC/MovieBox/MovieBox_NoSupportAd_v52.cs3"|
              "$SRC/MovieBox/MovieBoxPrebuilt.cs3"|
              "$SRC/MovieBox/prebuilt/MovieBox_NoSupportAd_v52.cs3"|
              "$SRC/MovieBox/prebuilt/MovieBoxPrebuilt.cs3"|
              "$SRC/MovieBox/prebuilt/MovieBoxPrebuilt.cs3.bin")
                continue
                ;;
            esac
            cp -f "$artifact" "$OUT/"
          done < <(find "$SRC" -type f -name "*.cs3" -print0)

          # Locate the MovieBox runtime artifact. The current repository
          # screenshot shows MovieBox_NoSupportAd_v52.cs3, but both names
          # are accepted so the build is not tied to one filename.
          PREBUILT=""
          CANDIDATES=(
            "$SRC/MovieBox/MovieBox_NoSupportAd_v52.cs3"
            "$SRC/MovieBox/MovieBoxPrebuilt.cs3"
            "$SRC/MovieBox/prebuilt/MovieBox_NoSupportAd_v52.cs3"
            "$SRC/MovieBox/prebuilt/MovieBoxPrebuilt.cs3"
            "$SRC/MovieBox/prebuilt/MovieBoxPrebuilt.cs3.bin"
          )

          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              PREBUILT="$candidate"
              break
            fi
          done

          if [ -z "$PREBUILT" ]; then
            echo "ERROR: MovieBox runtime artifact not found."
            echo "Checked:"
            printf '  %s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          echo "Using MovieBox runtime: $PREBUILT"

          PUBLISHED="$OUT/MovieBox.cs3"
          cp -f "$PREBUILT" "$PUBLISHED"

          # Start from the generated plugin list and replace any previous
          # MovieBox entry with our single direct MovieBox artifact.
          cp -f "$SRC/build/plugins.json" "$OUT/plugins.json"

          cat > "$OUT/repo.json" <<EOF
          {
            "name": "movieflick",
            "description": "movieflick CloudStream Extensions | 149",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
            ]
          }
          EOF

          python3 - "$OUT/plugins.json" "$PUBLISHED" "$GITHUB_REPOSITORY" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          plugins_path = pathlib.Path(sys.argv[1])
          cs3_path = pathlib.Path(sys.argv[2])
          repository = sys.argv[3]

          plugins = json.loads(plugins_path.read_text(encoding="utf-8"))

          plugins = [
              plugin for plugin in plugins
              if plugin.get("internalName") not in {
                  "MovieBox",
                  "MovieBoxProvider",
                  "MovieBoxProviderIN",
              }
          ]

          raw = cs3_path.read_bytes()
          file_hash = "sha256-" + hashlib.sha256(raw).hexdigest()

          plugins.append({
              "iconUrl": "https://github.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/raw/refs/heads/master/Logos/MovieBoxProvider/icon.png",
              "fileHash": file_hash,
              "apiVersion": 1,
              "repositoryUrl": f"https://github.com/{repository}",
              "fileSize": len(raw),
              "status": 1,
              "language": "hi",
              "authors": ["NivinCNC", "Movie-Flick"],
              "tvTypes": ["Movie", "TvSeries"],
              "version": 52,
              "internalName": "MovieBox",
              "description": "Multi Language Movies and Series Provider",
              "url": f"https://raw.githubusercontent.com/{repository}/builds/MovieBox.cs3",
              "name": "MovieBox"
          })

          plugins_path.write_text(
              json.dumps(plugins, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          echo "=== Build output ==="
          ls -lah "$OUT"

          test -f "$OUT/repo.json"
          test -f "$OUT/plugins.json"
          test -f "$OUT/MovieBox.cs3"

          echo "=== MovieBox metadata ==="
          python3 - "$OUT/plugins.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              plugins = json.load(handle)

          matches = [
              plugin for plugin in plugins
              if plugin.get("internalName") == "MovieBox"
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one MovieBox entry, found {len(matches)}"
              )

          print(json.dumps(matches[0], ensure_ascii=False, indent=2))
          PY

      - name: Prepare builds branch
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf builds

          git clone \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            builds

          cd builds

          if git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            git fetch origin builds
            git checkout builds
            git rm -rf . || true
            git clean -fdx
          else
            git checkout --orphan builds
            git rm -rf . || true
            git clean -fdx
          fi

      - name: Publish builds
        run: |
          set -euo pipefail

          cp -f "$GITHUB_WORKSPACE/build-output/"* \
            "$GITHUB_WORKSPACE/builds/"

          cd "$GITHUB_WORKSPACE/builds"

          test -f repo.json
          test -f plugins.json
          test -f MovieBox.cs3

          echo "✓ repo.json"
          echo "✓ plugins.json"
          echo "✓ MovieBox.cs3"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Build ${{ github.sha }}" || echo "No changes to commit"
          git push origin builds --force
