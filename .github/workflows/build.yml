name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TMDB_PRIMARY_API_KEY: ${{ secrets.TMDB_PRIMARY_API_KEY }}
          TMDB_PRIMARY_ACCESS_TOKEN: ${{ secrets.TMDB_PRIMARY_ACCESS_TOKEN }}
          TMDB_SECONDARY_API_KEY: ${{ secrets.TMDB_SECONDARY_API_KEY }}
          TMDB_SECONDARY_ACCESS_TOKEN: ${{ secrets.TMDB_SECONDARY_ACCESS_TOKEN }}
          TMDB_TERTIARY_API_KEY: ${{ secrets.TMDB_TERTIARY_API_KEY }}
          TMDB_TERTIARY_ACCESS_TOKEN: ${{ secrets.TMDB_TERTIARY_ACCESS_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/src"
          gradle make makePluginsJson --no-daemon

      - name: Prepare builds
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-output"
          mkdir -p "$GITHUB_WORKSPACE/build-output"

          find "$GITHUB_WORKSPACE/src" -type f -name "*.cs3" -exec cp {} "$GITHUB_WORKSPACE/build-output/" \;

          if [ -f "$GITHUB_WORKSPACE/src/build/plugins.json" ]; then
            cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/build-output/plugins.json"
          else
            echo "ERROR: plugins.json was not generated"
            exit 1
          fi

          cat > "$GITHUB_WORKSPACE/build-output/repo.json" <<'EOF'
          {
            "name": "movieflick",
            "description": "movieflick CloudStream Extensions | 149",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/msujoy149/Movie-Flick/builds/plugins.json"
            ]
          }
          EOF

          ls -lah "$GITHUB_WORKSPACE/build-output"
          cat "$GITHUB_WORKSPACE/build-output/repo.json"

      - name: Prepare builds branch
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf builds
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
          cd builds

          if git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            git fetch origin builds
            git checkout builds
            git rm -rf . || true
            git clean -fdx
          else
            git checkout --orphan builds
            git rm -rf . || true
            git clean -fdx
          fi

      - name: Copy build files
        run: |
          cp -f "$GITHUB_WORKSPACE/build-output/"* "$GITHUB_WORKSPACE/builds/"
          cd "$GITHUB_WORKSPACE/builds"
          ls -lah

          if [ -f "repo.json" ]; then echo "✓ repo.json found"; else echo "✗ repo.json missing"; exit 1; fi
          if [ -f "plugins.json" ]; then echo "✓ plugins.json found"; else echo "✗ plugins.json missing"; exit 1; fi

          cat repo.json

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build ${{ github.sha }}" || echo "No changes to commit"
          git push origin builds --force
