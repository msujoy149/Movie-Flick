name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TMDB_PRIMARY_API_KEY: ${{ secrets.TMDB_PRIMARY_API_KEY }}
          TMDB_PRIMARY_ACCESS_TOKEN: ${{ secrets.TMDB_PRIMARY_ACCESS_TOKEN }}
          TMDB_SECONDARY_API_KEY: ${{ secrets.TMDB_SECONDARY_API_KEY }}
          TMDB_SECONDARY_ACCESS_TOKEN: ${{ secrets.TMDB_SECONDARY_ACCESS_TOKEN }}
          TMDB_TERTIARY_API_KEY: ${{ secrets.TMDB_TERTIARY_API_KEY }}
          TMDB_TERTIARY_ACCESS_TOKEN: ${{ secrets.TMDB_TERTIARY_ACCESS_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/src"
          gradle make makePluginsJson --no-daemon

      - name: Prepare builds
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build-output"
          mkdir -p "$GITHUB_WORKSPACE/build-output"

          test -f "$GITHUB_WORKSPACE/src/build/plugins.json"

          # Copy every normal plugin except MovieBox. The MovieBox plugin is
          # supplied by the verified runtime artifact embedded below.
          find "$GITHUB_WORKSPACE/src" \
            -type f \
            -name "*.cs3" \
            ! -iname "MovieBox.cs3" \
            ! -iname "MovieBoxProvider.cs3" \
            ! -iname "MovieBoxProviderIN.cs3" \
            -exec cp {} "$GITHUB_WORKSPACE/build-output/" \\;

          # Embedded verified MovieBox runtime. This removes the need for a
          # MovieBoxPrebuilt.cs3 file in the repository and fixes the previous
          # 'Missing MovieBoxPrebuilt.cs3' failure.
