name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout source repository
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      # --------------------------------------------------
      # Setup Java 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # --------------------------------------------------
      # Build all CloudStream plugins
      # --------------------------------------------------
      - name: Build plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd "$GITHUB_WORKSPACE/src"

          gradle make makePluginsJson --no-daemon

      # --------------------------------------------------
      # Prepare build output
      # --------------------------------------------------
      - name: Prepare builds
        run: |
          rm -rf "$GITHUB_WORKSPACE/build-output"
          mkdir -p "$GITHUB_WORKSPACE/build-output"

          find "$GITHUB_WORKSPACE/src" \
            -type f \
            -name "*.cs3" \
            -exec cp {} "$GITHUB_WORKSPACE/build-output/" \;

          if [ -f "$GITHUB_WORKSPACE/src/build/plugins.json" ]; then
            cp "$GITHUB_WORKSPACE/src/build/plugins.json" \
              "$GITHUB_WORKSPACE/build-output/plugins.json"
          fi

          echo "Build output:"
          ls -lah "$GITHUB_WORKSPACE/build-output"

      # --------------------------------------------------
      # Create or checkout builds branch
      # --------------------------------------------------
      - name: Prepare builds branch
        run: |
          cd "$GITHUB_WORKSPACE"

          git clone \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            builds

          cd builds

          if git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            echo "builds branch exists"

            git fetch origin builds
            git checkout builds

            git rm -rf . || true
            git clean -fdx

          else
            echo "builds branch does not exist"
            echo "Creating builds branch"

            git checkout --orphan builds

            git rm -rf . || true
            git clean -fdx
          fi

      # --------------------------------------------------
      # Copy new plugin builds
      # --------------------------------------------------
      - name: Copy build files
        run: |
          cp -f "$GITHUB_WORKSPACE/build-output/"* \
            "$GITHUB_WORKSPACE/builds/" 2>/dev/null || true

          cd "$GITHUB_WORKSPACE/builds"

          echo "Final builds branch contents:"
          ls -lah

      # --------------------------------------------------
      # Push builds branch
      # --------------------------------------------------
      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "Build ${{ github.sha }}" \
            || echo "No changes to commit"

          git push origin builds --force
