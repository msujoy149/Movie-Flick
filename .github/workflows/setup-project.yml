name: Setup Movie-Flick Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project structure
        run: |
          set -e

          mkdir -p DhakaFTP/src/main/kotlin/com/movieflick/dhakaftp
          mkdir -p MovieBox/src/main/kotlin/com/movieflick/moviebox
          mkdir -p YouTube/src/main/kotlin/com/movieflick/youtube

          touch DhakaFTP/src/main/kotlin/com/movieflick/dhakaftp/.gitkeep
          touch MovieBox/src/main/kotlin/com/movieflick/moviebox/.gitkeep
          touch YouTube/src/main/kotlin/com/movieflick/youtube/.gitkeep

          cat > DhakaFTP/src/main/kotlin/com/movieflick/dhakaftp/DhakaFTPPlugin.kt <<'EOF'
          package com.movieflick.dhakaftp

          import android.content.Context
          import com.lagradost.cloudstream3.plugins.CloudstreamPlugin
          import com.lagradost.cloudstream3.plugins.Plugin

          @CloudstreamPlugin
          class DhakaFTPPlugin : Plugin() {

              override fun load(context: Context) {
                  registerMainAPI(DhakaFTP())
              }
          }
          EOF

      - name: Commit generated structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Setup Movie-Flick plugin structure"
            git push
          fi
